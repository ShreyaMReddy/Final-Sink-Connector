# Kafka Configuration
kafka.bootstrap.servers=kafka:9092
kafka.consumer.group.id=flink-elastic-group
kafka.consumer.auto.offset.reset=earliest
kafka.consumer.enable.auto.commit=false
kafka.consumer.isolation.level=read_committed

# Elasticsearch Configuration
elasticsearch.hosts=http://elasticsearch:9200
elasticsearch.connection.timeout=5000
elasticsearch.socket.timeout=60000
elasticsearch.bulk.size=5
elasticsearch.batch.timeout.ms=3000
elasticsearch.index.prefix=data_
elasticsearch.index.shards=1
elasticsearch.index.replicas=1
elasticsearch.retry.count=3
elasticsearch.retry.delay.ms=1000

# Flink Configuration
flink.parallelism=4
flink.checkpoint.interval.ms=60000
flink.checkpoint.timeout.ms=900000
flink.restart-strategy=fixed-delay
flink.restart-strategy.attempts=3
flink.restart-strategy.delay.ms=10000

# Window Configuration
window.enabled=false
window.size.minutes=5
window.slide.minutes=1

# Registry Configuration
registry.enabled=false
registry.storage.type=memory

# Security Configuration
security.encryption.enabled=false
security.encryption.algorithm=AES/GCM/NoPadding

# Monitoring Configuration
monitoring.enabled=true
monitoring.metrics.log.interval.ms=60000
logging.message.received=true
logging.level.com.example=INFO