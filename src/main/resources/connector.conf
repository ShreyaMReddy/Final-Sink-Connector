# Default Elasticsearch configuration
elasticsearch {
    hosts = "http://elasticsearch:9200"
    batch.size = 1000
    flush.interval.ms = 5000
    index.prefix = "data_"
}

# Window configuration
window {
    size.minutes = 5
    slide.minutes = 1
}

# Encryption configuration
encryption {
    enabled = false
    key = ${?ENCRYPTION_KEY}
    algorithm = "AES/GCM/NoPadding"
}

# Registry configuration
registry {
    enabled = false
    storage.type = "memory"  # Can be "memory" or "database"
}
